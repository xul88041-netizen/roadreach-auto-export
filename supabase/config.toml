project_id = "roadreach-auto-export"

[auth]
site_url = "http://127.0.0.1:4173/admin/"
additional_redirect_urls = ["http://127.0.0.1:4173/**"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[functions.submit-inquiry]
verify_jwt = false

[functions.gmail-sync]
verify_jwt = true
