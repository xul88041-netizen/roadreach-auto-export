<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071826"><title>Reset administrator password</title><link rel="stylesheet" href="admin.css"></head>
<body>
  <section class="login-screen"><form class="login-card" id="resetPasswordForm" hidden><div class="admin-brand"><span>RR</span><div><b>ROADREACH</b><small>ADMINISTRATION</small></div></div><h1>Set a new password</h1><p>Your password is processed only by Supabase Auth.</p><label>New password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirm new password<input type="password" name="confirmPassword" autocomplete="new-password" minlength="12" required></label><button class="primary" type="submit">Save password</button><output class="form-message" id="resetPasswordMessage"></output></form><div class="login-card" id="resetStatus"><div class="admin-brand"><span>RR</span><div><b>ROADREACH</b><small>ADMINISTRATION</small></div></div><h1>Password recovery</h1><output class="form-message" id="resetStatusMessage">Checking secure recovery session…</output><a href="./">← Back to sign in</a></div></section>
  <script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="reset-password.js"></script>
</body></html>
